<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Алматы Сервері - BLACK ALMATY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">BLACK ALMATY</a></div>
        <nav><a href="index.html">Басты бет</a> | <a href="profil.html">Профиль</a></nav>
    </header>

    <div class="container">
        <div class="category" style="padding: 20px;">
            <h2>💬 Алматы сервері</h2>
            <br>
            
            <div id="createTopicBox" style="background:#1e1e1e; padding:15px; border-radius:5px; margin-bottom:20px;">
                <h3>Жаңа тақырып / Шағым ашу</h3>
                <br>
                <div class="form-group" id="ownerPrefixGroup" style="display:none;">
                    <label>Префикс таңдау:</label>
                    <select id="topicPrefix">
                        <option value="Игрок">Игрок</option>
                        <option value="Мл. Модератор">Мл. Модератор</option>
                        <option value="Модератор">Модератор</option>
                        <option value="Ст. Модератор">Ст. Модератор</option>
                        <option value="Администратор">Администратор</option>
                        <option value="Ст. Администратор">Ст. Администратор</option>
                        <option value="ГС/ЗГС">ГС/ЗГС</option>
                        <option value="Куратор Администраций">Куратор Администраций</option>
                        <option value="Технический Специалист">Технический Специалист</option>
                        <option value="Зам. Главного Администратора">Зам. Главного Администратора</option>
                        <option value="Главный Администратор">Главный Администратор</option>
                        <option value="Зам. Основателя">Зам. Основателя</option>
                        <option value="Основатель">Основатель</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="topicTitleInput" placeholder="Тақырып аты...">
                </div>
                <button class="btn-primary" onclick="createTopicHere()">Жариялау</button>
            </div>

            <hr style="border-color:#333;"><br>
            <h3>Тақырыптар тізімі:</h3>
            <div id="topicsArea"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const SECTION_NAME = "almaty";
        const user = getCurrentUser();

        if (user && user.isOwner) {
            document.getElementById('ownerPrefixGroup').style.display = 'block';
        }

        function createTopicHere() {
            const title = document.getElementById('topicTitleInput').value.trim();
            const prefix = document.getElementById('topicPrefix') ? document.getElementById('topicPrefix').value : 'Игрок';
            if(!title) return alert("Тақырыпты жазыңыз!");
            addTopic(SECTION_NAME, title, prefix);
        }

        function render() {
            const container = document.getElementById('topicsArea');
            const list = getTopics(SECTION_NAME);

            if(list.length === 0) {
                container.innerHTML = '<p style="color:#777; margin-top:10px;">Әлі тақырыптар жоқ.</p>';
                return;
            }

            list.forEach(t => {
                const canClose = user && (ADMIN_HIERARCHY.includes(user.role) || user.isOwner);
                const canDelete = user && user.isOwner; // Код жазған адам өшіре алады

                let statusClass = t.status === 'Открыто' ? 'status-open' : 'status-closed';

                let html = `
                    <div class="topic-card">
                        <div>
                            <span class="badge ${statusClass}">${t.status}</span>
                            <span class="badge prefix-${t.prefix.replace(/[\s\.\/]/g, '-')}">${t.prefix}</span>
                            <b>${t.title}</b>
                            <div style="font-size:11px; color:#888;">Авторы: ${t.author}</div>
                        </div>
                        <div>
                `;

                if (canClose && t.status === 'Открыто') {
                    html += `<button class="btn-warning" onclick="closeTopic(${t.id})">Жабу</button> `;
                }
                if (canDelete) {
                    html += `<button class="btn-danger" onclick="deleteTopic(${t.id})">Өшіру</button>`;
                }

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        render();
    </script>
</body>
</html>
